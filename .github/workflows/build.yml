name: Build Commands

on:
  workflow_dispatch:
    inputs:
      publish_public_release:
        description: "Publish this ARM64 APK as a public prerelease asset for Telegram delivery"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Flutter doctor host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev mesa-utils

      - name: Materialize project
        run: |
          chmod +x tool/bootstrap.sh
          ./tool/bootstrap.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK and cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "sdkmanager --licenses failed with exit code $LICENSE_STATUS"
            exit "$LICENSE_STATUS"
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;27.0.12077973"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Show Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Check and test Rust engine
        run: |
          cargo fmt --manifest-path rust/commands-engine/Cargo.toml --all
          cargo test --manifest-path rust/commands-engine/Cargo.toml

      - name: Build Rust engine for Android ARM64
        working-directory: rust/commands-engine
        run: |
          cargo ndk -t arm64-v8a -o ../../android/app/src/main/jniLibs build --release


      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build ARM64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify ARM64-only APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name 'app-release.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" > apk-list.txt

          grep -oE 'lib/[^/]+/' apk-list.txt | cut -d/ -f2 | sort -u > apk-abis.txt
          if ! grep -Fxq "arm64-v8a" apk-abis.txt; then
            echo "Missing arm64-v8a native libraries."
            exit 1
          fi
          ABI_COUNT="$(wc -l < apk-abis.txt)"
          if [ "$ABI_COUNT" -ne 1 ]; then
            echo "Unexpected native ABIs found:"
            cat apk-abis.txt
            exit 1
          fi
          echo "Verified ABI: arm64-v8a only"

          if unzip -l "$APK" | grep -F 'rish_shizuku.dex'; then
            echo "Forbidden rish_shizuku.dex found."
            exit 1
          fi

          if unzip -l "$APK" | grep -Ei '(^|/)(rish|librish)(_|[.]|/)' ; then
            echo "Forbidden rish execution layer artifact found."
            exit 1
          fi

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | sed -n '1,5p'
          fi

          sha256sum "$APK" | tee apk.sha256

      - name: Package full Flutter project
        run: |
          rm -rf release-package
          mkdir -p release-package
          rsync -a --exclude='.git/' --exclude='build/' --exclude='.dart_tool/' --exclude='android/app/src/main/jniLibs/' ./ release-package/
          (cd release-package && zip -qr ../commands-flutter-project.zip .)

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: commands-arm64-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload full Flutter project
        uses: actions/upload-artifact@v7
        with:
          name: commands-flutter-project
          path: commands-flutter-project.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish public ARM64 APK release for Telegram delivery
        if: github.event_name == 'workflow_dispatch' && inputs.publish_public_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          cp "$APK" commands-arm64.apk
          sha256sum commands-arm64.apk > commands-arm64.apk.sha256
          TAG="commands-arm64-${GITHUB_RUN_ID}"
          gh release create "$TAG" commands-arm64.apk commands-arm64.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Commands ARM64 APK (${GITHUB_RUN_NUMBER})" \
            --notes "ARM64-only APK built with Flutter 3.47.0. ABI: arm64-v8a. SHA-256 checksum is attached." \
            --prerelease

      - name: Commit generated Flutter project
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: materialize Flutter project [skip ci]"
          git push origin HEAD:main
