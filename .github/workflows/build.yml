name: Build Commands

on:
  workflow_dispatch:
    inputs:
      publish_public_release:
        description: "Publish this APK as a public prerelease asset for Telegram delivery"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Materialize project
        run: |
          chmod +x tool/bootstrap.sh
          ./tool/bootstrap.sh

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build multi-architecture APK
        run: flutter build apk --release

      - name: Verify multi-architecture APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name 'app-release.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" > apk-list.txt

          for ABI in armeabi-v7a arm64-v8a x86_64; do
            if ! grep -Fq "lib/${ABI}/" apk-list.txt; then
              echo "Missing native libraries for supported ABI: ${ABI}"
              exit 1
            fi
          done
          echo "Verified ABIs: armeabi-v7a, arm64-v8a, x86_64"

          if unzip -l "$APK" | grep -F 'rish_shizuku.dex'; then
            echo "Forbidden rish_shizuku.dex found."
            exit 1
          fi

          if unzip -l "$APK" | grep -Ei '(^|/)(rish|librish)(_|\.|/)' ; then
            echo "Forbidden rish execution layer artifact found."
            exit 1
          fi

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | sed -n '1,5p'
          fi

          sha256sum "$APK" | tee apk.sha256

      - name: Package full Flutter project
        run: |
          rm -rf release-package
          mkdir -p release-package
          rsync -a --exclude='.git/' --exclude='build/' --exclude='.dart_tool/' ./ release-package/
          (cd release-package && zip -qr ../commands-flutter-project.zip .)

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: commands-universal-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload full Flutter project
        uses: actions/upload-artifact@v7
        with:
          name: commands-flutter-project
          path: commands-flutter-project.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish public APK release for Telegram delivery
        if: github.event_name == 'workflow_dispatch' && inputs.publish_public_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          cp "$APK" commands-universal.apk
          sha256sum commands-universal.apk > commands-universal.apk.sha256
          TAG="commands-universal-${GITHUB_RUN_ID}"
          gh release create "$TAG" commands-universal.apk commands-universal.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Commands Universal APK (${GITHUB_RUN_NUMBER})" \
            --notes "Multi-architecture APK built with Flutter 3.47.0. Supported ABIs: armeabi-v7a, arm64-v8a, x86_64. SHA-256 checksum is attached." \
            --prerelease

      - name: Commit generated Flutter project
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: materialize Flutter project [skip ci]"
          git push origin HEAD:main
