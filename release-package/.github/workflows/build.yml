name: Build Commands

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Materialize project
        run: |
          chmod +x tool/bootstrap.sh
          ./tool/bootstrap.sh

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          unzip -l "$APK" > apk-list.txt

          if grep -E 'lib/(armeabi-v7a|x86|x86_64)/' apk-list.txt; then
            echo "Unexpected non-arm64 native library found."
            exit 1
          fi

          grep -q 'lib/arm64-v8a/' apk-list.txt

          if unzip -l "$APK" | grep -F 'rish_shizuku.dex'; then
            echo "Forbidden rish_shizuku.dex found."
            exit 1
          fi

          if unzip -l "$APK" | grep -Ei '(^|/)(rish|librish)(_|\.|/)' ; then
            echo "Forbidden rish execution layer artifact found."
            exit 1
          fi

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | sed -n '1,5p'
          fi

          sha256sum "$APK" | tee apk.sha256

      - name: Package full Flutter project
        run: |
          rm -rf release-package
          mkdir -p release-package
          rsync -a --exclude='.git/' --exclude='build/' --exclude='.dart_tool/' ./ release-package/
          (cd release-package && zip -qr ../commands-flutter-project.zip .)

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v7
        with:
          name: commands-arm64-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload full Flutter project
        uses: actions/upload-artifact@v7
        with:
          name: commands-flutter-project
          path: commands-flutter-project.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated Flutter project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: materialize Flutter project [skip ci]"
          git push origin HEAD:main
